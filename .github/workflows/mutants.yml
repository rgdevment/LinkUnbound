name: Mutants

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `paths` on the trigger leaves a required check unreported for good; a skipped job counts as met.
  changes:
    name: what the branch touched
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mutable: ${{ steps.look.outputs.mutable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: look
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          watched='^(crates/|app/src/|\.cargo/mutants\.toml$|app/stryker\.config\.json$|\.github/workflows/mutants\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          if git diff --name-only --diff-filter=d "$from" HEAD | grep -qE "$watched"; then
            echo "mutable=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutable=false" >> "$GITHUB_OUTPUT"
          fi

  crates-on-the-branch:
    name: crates / the lines this branch changed
    runs-on: ubuntu-latest
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.mutable == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What the branch changed in the crates
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          git diff "$from" -- crates/linkunbound-core crates/linkunbound-shell > branch.diff
          if [ -s branch.diff ]; then echo "any=yes" >> "$GITHUB_OUTPUT"; fi

      - name: The toolchain rust-toolchain.toml names
        if: steps.touched.outputs.any == 'yes'
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.touched.outputs.any == 'yes'
        with:
          tool: nextest
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.touched.outputs.any == 'yes'
        with:
          tool: cargo-mutants

      - name: What a desktop is not needed to build
        if: steps.touched.outputs.any == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libxcb1-dev

      - name: A mutant that lives on a line this branch wrote
        id: run
        if: steps.touched.outputs.any == 'yes'
        run: |
          set +e
          cargo mutants --in-diff branch.diff -p linkunbound-core -p linkunbound-shell -j 2 \
            --exclude-re 'mac::|local_web_file|launchable_file|host::|reaction_to|sent_by_launch_services|platform::|dress_natively|replace is_bundle|relaunch_resident|relay_links|hand_to_the_resident|replace base -> Option|replace address -> String|replace named -> Option<Name|replace make_room|replace forget with'
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always() && steps.touched.outputs.any == 'yes'
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: The lines this branch changed
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.touched.outputs.any == 'yes'
        with:
          name: mutants-branch-crates
          path: mutants.out/
          retention-days: 7

  mac-on-the-branch:
    name: mac / the lines this branch changed
    runs-on: macos-latest
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.mutable == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What the branch changed in the crates, read with a Mac's eyes
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          git diff "$from" -- crates > branch.diff
          if [ -s branch.diff ]; then echo "any=yes" >> "$GITHUB_OUTPUT"; fi

      - name: The toolchain rust-toolchain.toml names
        if: steps.touched.outputs.any == 'yes'
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.touched.outputs.any == 'yes'
        with:
          tool: nextest
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.touched.outputs.any == 'yes'
        with:
          tool: cargo-mutants

      - name: A mutant that lives on a line this branch wrote
        id: run
        if: steps.touched.outputs.any == 'yes'
        run: |
          set +e
          cargo mutants --in-diff branch.diff -p linkunbound-mac -p linkunbound-core -p linkunbound-shell -j 2 \
            --exclude-re 'replace forget with'
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always() && steps.touched.outputs.any == 'yes'
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: The lines this branch changed, on a Mac
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.touched.outputs.any == 'yes'
        with:
          name: mutants-branch-mac
          path: mutants.out/
          retention-days: 7

  settings-on-the-branch:
    name: settings / the lines this branch changed
    runs-on: ubuntu-latest
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.mutable == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What the branch changed in the settings backend
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          git diff "$from" -- app/src-tauri/src > branch.diff
          if [ -s branch.diff ]; then echo "any=yes" >> "$GITHUB_OUTPUT"; fi

      - name: The toolchain rust-toolchain.toml names
        if: steps.touched.outputs.any == 'yes'
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.touched.outputs.any == 'yes'
        with:
          tool: nextest
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.touched.outputs.any == 'yes'
        with:
          tool: cargo-mutants

      - name: What a desktop is not needed to build
        if: steps.touched.outputs.any == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libxcb1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: The resident rides along
        if: steps.touched.outputs.any == 'yes'
        run: bash scripts/sidecar.sh

      - name: A mutant that lives on a line this branch wrote
        id: run
        if: steps.touched.outputs.any == 'yes'
        run: |
          set +e
          cargo mutants --in-diff branch.diff -p linkunbound-settings --in-place \
            --exclude-re 'mac::|local_web_file|launchable_file|host::|reaction_to|sent_by_launch_services|platform::|dress_natively|replace is_bundle|relaunch_resident|relay_links|hand_to_the_resident|replace base -> Option|replace address -> String|replace named -> Option<Name|replace make_room|replace forget with'
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always() && steps.touched.outputs.any == 'yes'
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: The lines this branch changed in settings
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.touched.outputs.any == 'yes'
        with:
          name: mutants-branch-settings
          path: mutants.out/
          retention-days: 7

  window-on-the-branch:
    name: window / the lines this branch changed
    runs-on: ubuntu-latest
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.mutable == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What the branch changed in the window
        id: touched
        working-directory: app
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          list=$(git diff --unified=0 --relative --diff-filter=d "$from" -- src \
            | awk '
                /^\+\+\+ b\// { f = substr($2, 3); next }
                /^@@/ {
                  if (f !~ /\.tsx?$/) next
                  if (f ~ /\.test\.tsx?$/) next
                  if (f ~ /^src\/tests\//) next
                  if (f ~ /^src\/(i18n)\.ts$/) next
                  if (f ~ /^src\/main\.tsx$/) next
                  if (f ~ /\.d\.ts$/) next
                  split($3, a, ",")
                  start = substr(a[1], 2) + 0
                  len = (a[2] == "" ? 1 : a[2] + 0)
                  if (len > 0) print f ":" start "-" start + len - 1
                }' \
            | paste -sd, -)
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.touched.outputs.list != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: steps.touched.outputs.list != ''
        working-directory: app
        run: npm ci

      - name: A mutant that lives in a file this branch wrote
        if: steps.touched.outputs.list != ''
        working-directory: app
        # Through the environment, never pasted into the script: the list is file names a pull
        # request chose, and a name with a quote or a `$(...)` in it would run as shell.
        env:
          TOUCHED: ${{ steps.touched.outputs.list }}
        run: npx stryker run --mutate "$TOUCHED"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.touched.outputs.list != ''
        with:
          name: mutants-branch-window
          path: app/reports/
          retention-days: 7
