name: Mutants sweep

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-sweep
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DESKTOP_LIBS: libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libxcb1-dev

jobs:
  core:
    name: core / every mutant
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest,cargo-mutants

      - name: Every mutant the core carries
        id: run
        run: |
          set +e
          cargo mutants -p linkunbound-core -j 2 --exclude-re 'mac::|local_web_file|launchable_file|host::|reaction_to|sent_by_launch_services|platform::|dress_natively|replace is_bundle|relaunch_resident|relay_links|hand_to_the_resident|replace base -> Option|replace address -> String|replace named -> Option<Name|replace make_room|replace forget with'
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: linkunbound-core
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-core
          path: mutants.out/
          retention-days: 14

  shell:
    name: shell / shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest,cargo-mutants

      - name: What a desktop is not needed to build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $DESKTOP_LIBS

      - name: One quarter of every mutant the picker carries
        id: run
        run: |
          set +e
          cargo mutants -p linkunbound-shell --shard $(( ${{ matrix.shard }} - 1 ))/4 -j 2 \
            --exclude-re 'mac::|local_web_file|launchable_file|host::|reaction_to|sent_by_launch_services|platform::|dress_natively|replace is_bundle|relaunch_resident|relay_links|hand_to_the_resident|replace base -> Option|replace address -> String|replace named -> Option<Name|replace make_room|replace forget with'
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: linkunbound-shell, shard ${{ matrix.shard }} of 4
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-shell-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 14

  settings:
    name: settings / shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest,cargo-mutants

      - name: What a desktop is not needed to build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $DESKTOP_LIBS libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: The resident rides along
        run: bash scripts/sidecar.sh

      - name: One half of every mutant the settings backend carries
        id: run
        run: |
          set +e
          cargo mutants -p linkunbound-settings --shard $(( ${{ matrix.shard }} - 1 ))/2 --in-place \
            --exclude-re 'mac::|local_web_file|launchable_file|host::|reaction_to|sent_by_launch_services|platform::|dress_natively|replace is_bundle|relaunch_resident|relay_links|hand_to_the_resident|replace base -> Option|replace address -> String|replace named -> Option<Name|replace make_room|replace forget with'
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: linkunbound-settings, shard ${{ matrix.shard }} of 2
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-settings-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 14

  mac:
    name: mac / shard ${{ matrix.shard }} of 2
    runs-on: macos-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest,cargo-mutants

      - name: One half of every mutant the Mac crate carries, and what only a Mac compiles elsewhere
        id: run
        run: |
          set +e
          cargo mutants -p linkunbound-mac --shard $(( ${{ matrix.shard }} - 1 ))/2 -j 2
          code=$?
          cargo mutants -p linkunbound-core -p linkunbound-shell --shard $(( ${{ matrix.shard }} - 1 ))/2 -j 2 \
            -F 'mac::|local_web_file|launchable_file|reaction_to|sent_by_launch_services|replace drawing|replace base -> Option|replace address -> String|replace named -> Option<Name|replace make_room' -o mutants-elsewhere
          elsewhere=$?
          [ "$elsewhere" -eq 0 ] || code=$elsewhere
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: linkunbound-mac, shard ${{ matrix.shard }} of 2
        run: bash scripts/mutants-report.sh

      - name: What survived of the Mac branches elsewhere
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: the Mac branches of core and shell, shard ${{ matrix.shard }} of 2
          OUT: mutants-elsewhere/mutants.out
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-mac-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-mac-elsewhere-${{ matrix.shard }}
          path: mutants-elsewhere/mutants.out/
          retention-days: 14

  window:
    name: window / shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: One quarter of the window, dealt out so the shards weigh the same
        run: |
          list=$(git ls-files src \
            | grep -E '\.tsx?$' \
            | grep -vE '\.test\.tsx?$|^src/tests/|^src/i18n\.ts$|^src/main\.tsx$|\.d\.ts$' \
            | xargs wc -l \
            | grep -v ' total$' \
            | sort -rn \
            | awk -v shard=${{ matrix.shard }} -v many=4 '
                { name[NR] = $2; wide[NR] = $1; count = NR }
                END {
                  for (i = 1; i <= count; i++) {
                    least = 1
                    for (s = 2; s <= many; s++) if (load[s] < load[least]) least = s
                    load[least] += wide[i]
                    if (least == shard) print name[i]
                  }
                }' \
            | paste -sd, -)
          echo "$list"
          npx stryker run --mutate "$list" --concurrency 4 \
            --reporters progress-append-only,clear-text,json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-window-${{ matrix.shard }}
          path: app/reports/
          retention-days: 14

  score:
    name: what the whole sweep came to
    # A dispatch from another branch would write its numbers into the score main is read by.
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    needs: [core, shell, settings, mac, window]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] it pushes the score branch

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-core
          path: crates

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-shell-*
          path: crates

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-settings-*
          path: crates

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-mac-*
          path: crates

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-window-*
          path: window

      - name: Every shard told as one report
        env:
          WANT_WINDOW: 4
          WANT_CRATES: 11
        run: bash scripts/mutants-score.sh

      - name: The report where a survivor can be read one by one
        env:
          KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::no dashboard key: the report goes no further than the artifact"
            exit 0
          fi
          curl -sS --fail-with-body -X PUT \
            "https://dashboard.stryker-mutator.io/api/reports/github.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $KEY" \
            -d @window.json

      - name: The number, on the branch that holds nothing else
        run: |
          mv mutants.json "$RUNNER_TEMP/mutants.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin score --depth 1 2>/dev/null; then
            git switch -C score FETCH_HEAD
          else
            git switch --orphan score
          fi
          git rm -rq --cached . 2>/dev/null || true

          cp "$RUNNER_TEMP/mutants.json" mutants.json
          git add -- mutants.json
          if git diff --cached --quiet; then
            echo "the score has not moved"
            exit 0
          fi
          git commit -m "chore: what the sweep of $(date -u +%Y-%m-%d) came to"
          git push origin score
