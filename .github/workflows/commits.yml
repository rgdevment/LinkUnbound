name: Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          failed=0

          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::${sha:0:8} does not follow conventional commits: $subject"
              failed=1
              continue
            fi

            if [ "${#subject}" -gt 90 ]; then
              echo "::error::${sha:0:8} subject is ${#subject} characters, keep it under 90: $subject"
              failed=1
            fi
          done < <(git rev-list --no-merges "$BASE".."$HEAD")

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Expected: type(optional-scope): description"
            echo "Types:    feat fix docs style refactor perf test build ci chore revert"
            echo "Example:  feat(parser): recognise weekday names in Spanish"
            exit 1
          fi

          echo "All commit subjects are well formed."
