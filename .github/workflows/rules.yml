name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: The workflows parse
        run: |
          # A workflow that does not parse fails in zero seconds with no job, no line and no
          # diagnosis — and release only ever runs once the tag is already pushed.
          status=0
          for one in .github/workflows/*.yml .github/actions/*/action.yml; do
            if ! npx --no-install js-yaml "$one" >/dev/null; then
              echo "::error file=$one::this file is not valid YAML"
              status=1
            fi
            # A line in column zero ends whatever run block it lands in, which a YAML parser
            # accepts and GitHub refuses to load — with no job, no line and no diagnosis. It is
            # what a line continuation leaves behind when an edit does not carry the backslash.
            if grep -nE '^[^[:space:]#]' "$one" |
               grep -vE '^[0-9]+:(name|on|permissions|jobs|env|concurrency|defaults|run-name|description|inputs|outputs|runs):'; then
              echo "::error file=$one::a line starts in column zero that is not a top-level key"
              status=1
            fi
          done
          exit $status

      # Parsing says nothing of a needs that names a job that is gone, or of input expanded into a shell.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: zizmor@1.30.1
      - name: The workflows mean what they say
        env:
          GH_TOKEN: ${{ github.token }}
          SHELLCHECK_OPTS: --severity=warning
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
          zizmor --min-severity medium .github

      # One implementation for the conventions a person can break in a second: the hook runs
      # the same file, so local and CI can never drift into saying different things.
      - name: The conventions the script keeps
        run: bash scripts/rules.sh

      # Nothing else looks at a subject that reached main without a pull request, and one push
      # can carry several: every commit it brought is weighed, not only the last.
      - name: The subjects that landed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            bash scripts/commits.sh --landed "$BEFORE..$AFTER"
          else
            bash scripts/commits.sh --title "$(git log -1 --format=%s)"
          fi

      - name: The toolchain rust-toolchain.toml names
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tests are deterministic
        run: |
          turns=1
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            turns=20
          fi
          for _ in $(seq 1 "$turns"); do
            cargo test -p linkunbound-core --quiet || exit 1
          done
