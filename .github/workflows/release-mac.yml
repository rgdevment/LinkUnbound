name: Release (macOS)

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string
    workflow_dispatch:
        inputs:
            version:
                description: "Version to use (e.g. 2.0.0). Defaults to 2.0.0-dev"
                required: false
                default: "2.0.0-dev"

permissions:
    contents: read

jobs:
    build-macos:
        runs-on: macos-15
        timeout-minutes: 45
        name: Build macOS (Universal)

        env:
            MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
            MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            RELEASE_APP_PATH: apps/linkunbound/build/macos/Build/Products/Release/LinkUnbound.app

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref_name }}

            - name: Resolve version
              id: version
              uses: ./.github/actions/resolve-version
              with:
                  version: ${{ inputs.version }}

            - name: Set up Flutter workspace
              uses: ./.github/actions/setup-flutter

            - name: Set app version
              uses: ./.github/actions/set-app-version
              with:
                  version: ${{ steps.version.outputs.version }}

            - name: Import signing certificate
              if: env.MACOS_CERTIFICATE_P12 != ''
              run: |
                  set -euo pipefail

                  KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

                  CERT_PATH="$RUNNER_TEMP/certificate.p12"
                  echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

                  security import "$CERT_PATH" \
                    -k "$KEYCHAIN_PATH" \
                    -P "$MACOS_CERTIFICATE_PASSWORD" \
                    -T /usr/bin/codesign \
                    -T /usr/bin/security

                  security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

                  rm -f "$CERT_PATH"
                  echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
                  echo "Certificate imported successfully"

            - name: Refresh CocoaPods lock
              run: |
                  set -euo pipefail
                  rm -f apps/linkunbound/macos/Podfile.lock
                  cd apps/linkunbound/macos && pod install --repo-update

            - name: Build macOS release (universal)
              working-directory: apps/linkunbound
              run: |
                  flutter build macos --release \
                    --build-name="${{ steps.version.outputs.build-name }}" \
                    --build-number="${{ steps.version.outputs.build-number }}" \
                    --dart-define="APP_VERSION=${{ steps.version.outputs.version }}"

            - name: Verify universal binary
              run: |
                  set -euo pipefail

                  ARCHS=$(lipo -archs "$RELEASE_APP_PATH/Contents/MacOS/LinkUnbound")
                  echo "Architectures: $ARCHS"
                  if [[ "$ARCHS" != *"x86_64"* ]] || [[ "$ARCHS" != *"arm64"* ]]; then
                    echo "::error::Expected universal binary (x86_64 + arm64), got: $ARCHS"
                    exit 1
                  fi
                  echo "Universal binary verified (x86_64 + arm64)"

            - name: Sign application
              if: env.MACOS_CERTIFICATE_P12 != ''
              run: |
                  set -eu

                  SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk '{print $2}')
                  echo "Signing with identity: $SIGN_IDENTITY"

                  codesign --deep --force --options runtime \
                    --entitlements "apps/linkunbound/macos/Runner/Release.entitlements" \
                    --sign "$SIGN_IDENTITY" \
                    "$RELEASE_APP_PATH"

                  echo "Verifying signature..."
                  codesign --verify --deep --strict "$RELEASE_APP_PATH"
                  echo "Signature verified"

            - name: Ad-hoc sign (unsigned build)
              if: env.MACOS_CERTIFICATE_P12 == ''
              run: |
                  set -euo pipefail
                  codesign --deep --force --sign - "$RELEASE_APP_PATH"
                  echo "Ad-hoc signed (unsigned build)"

            - name: Install create-dmg
              run: brew install create-dmg

            - name: Create DMG
              env:
                  DMG_PATH: apps/linkunbound/dist/LinkUnbound_${{ steps.version.outputs.version }}_universal.dmg
              run: |
                  set -euo pipefail

                  mkdir -p apps/linkunbound/dist

                  create-dmg \
                    --volname "LinkUnbound" \
                    --window-pos 200 120 \
                    --window-size 660 400 \
                    --icon-size 80 \
                    --icon "LinkUnbound.app" 180 190 \
                    --app-drop-link 480 190 \
                    --hide-extension "LinkUnbound.app" \
                    --no-internet-enable \
                    "$DMG_PATH" \
                    "$RELEASE_APP_PATH" \
                    || true

                  if [[ ! -f "$DMG_PATH" ]]; then
                    echo "::error::DMG was not created"
                    exit 1
                  fi

                  echo "DMG created: $DMG_PATH ($(du -h "$DMG_PATH" | cut -f1))"

            - name: Sign DMG
              if: env.MACOS_CERTIFICATE_P12 != ''
              env:
                  DMG_PATH: apps/linkunbound/dist/LinkUnbound_${{ steps.version.outputs.version }}_universal.dmg
              run: |
                  set -eu

                  SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk '{print $2}')
                  echo "Signing DMG with identity: $SIGN_IDENTITY"

                  codesign --force --sign "$SIGN_IDENTITY" "$DMG_PATH"
                  codesign --verify "$DMG_PATH"
                  echo "DMG signed"

            - name: Notarize DMG
              if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
              env:
                  DMG_PATH: apps/linkunbound/dist/LinkUnbound_${{ steps.version.outputs.version }}_universal.dmg
              run: |
                  set -euo pipefail

                  echo "Submitting for notarization..."
                  xcrun notarytool submit "$DMG_PATH" \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_APP_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" \
                    --wait \
                    --timeout 600

                  echo "Stapling notarization ticket..."
                  xcrun stapler staple "$DMG_PATH"

                  echo "Verifying notarization..."
                  spctl --assess --type open --context context:primary-signature "$DMG_PATH"
                  echo "Notarization complete"

            - name: Cleanup keychain
              if: always() && env.KEYCHAIN_PATH != ''
              run: security delete-keychain "$KEYCHAIN_PATH" || true

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: release-macos
                  path: apps/linkunbound/dist/*.dmg
                  retention-days: 5
