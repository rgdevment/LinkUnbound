name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/sidecar
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --workspace --all-targets
      - name: Each crate builds on its own, without the features its neighbours bring along
        shell: bash
        run: |
          for one in linkunbound-core linkunbound-win linkunbound-mac linkunbound-shell linkunbound-settings; do
            cargo check -p "$one" --all-targets
          done
      - run: cargo nextest run --workspace --no-tests=pass
      - if: runner.os == 'Windows'
        run: cargo test --doc --workspace

  lint:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  picker:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  prose:
    name: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:md

  audit:
    name: advisories + licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - name: What a desktop is not needed to build
        run: |
          # The picker pulls in a tray and a window: tray-icon wants GTK and winit wants the
          # display libraries. All of it has to link; none of it has to run, because the tests
          # that need a window ask Slint's testing backend for one instead of the screen.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libxcb1-dev
          cargo llvm-cov nextest -p linkunbound-core -p linkunbound-shell --lcov --output-path lcov-rust.info

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: The picker
        working-directory: app
        run: |
          npm ci
          npm run test:coverage

      - name: Every path is relative to the repository, which is what Sonar reads
        run: |
          sed -i "s|^SF:$PWD/|SF:|" lcov-rust.info
          sed -i -e "s|^SF:$PWD/app/|SF:app/|" -e "s|^SF:src/|SF:app/src/|" \
            app/coverage/lcov.info

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov-rust.info
            app/coverage/lcov.info
          retention-days: 1

  coverage-mac:
    name: coverage / the Mac crate
    runs-on: macos-latest
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: The Mac crate, and the Mac branches of the core and the picker
        run: cargo llvm-cov nextest -p linkunbound-mac -p linkunbound-core -p linkunbound-shell --lcov --output-path lcov-mac.info
      - name: Every path is relative to the repository, which is what Sonar reads
        run: sed -i '' "s|^SF:$PWD/|SF:|" lcov-mac.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-mac
          path: lcov-mac.info
          retention-days: 1

  sonar:
    name: sonarcloud
    needs: [coverage, coverage-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: .

      - uses: actions/download-artifact@v8
        with:
          name: coverage-mac
          path: .

      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=crates,app/src,app/src-tauri/src
            -Dsonar.tests=crates,app/src
            -Dsonar.test.inclusions=crates/*/tests/**,app/src/**/*.test.ts,app/src/**/*.test.tsx
            -Dsonar.exclusions=crates/*/tests/**,app/src/tests/**
            -Dsonar.rust.lcov.reportPaths=lcov-rust.info,lcov-mac.info
            -Dsonar.javascript.lcov.reportPaths=app/coverage/lcov.info
            -Dsonar.cpd.exclusions=app/src/i18n.ts
            -Dsonar.rust.clippy.enabled=false
            -Dsonar.coverage.exclusions=app/src/main.tsx,app/src-tauri/src/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
