name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: The resident rides along
        shell: bash
        run: bash scripts/sidecar.sh
      - run: cargo nextest run --workspace --no-tests=pass
      - run: cargo test --doc --workspace

  lint:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: The resident rides along
        shell: bash
        run: bash scripts/sidecar.sh
      - run: cargo clippy --workspace --all-targets

  picker:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  prose:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:md

  audit:
    name: advisories + licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - name: What a desktop is not needed to build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libxcb1-dev
          cargo llvm-cov nextest             -p linkunbound-core             -p linkunbound-shell             --lcov --output-path lcov-rust.info

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: The picker
        working-directory: app
        run: |
          npm ci
          npm run test:coverage

      - name: Every path is relative to the repository, which is what Sonar reads
        run: |
          sed -i "s|^SF:$PWD/|SF:|" lcov-rust.info
          sed -i -e "s|^SF:$PWD/app/|SF:app/|" -e "s|^SF:src/|SF:app/src/|" \
            app/coverage/lcov.info

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov-rust.info
            app/coverage/lcov.info
          retention-days: 1

  sonar:
    name: sonarcloud
    needs: coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: coverage
          path: .

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=crates,app/src,app/src-tauri/src
            -Dsonar.tests=crates,app/src
            -Dsonar.test.inclusions=crates/*/tests/**,app/src/**/*.test.tsx
            -Dsonar.exclusions=crates/*/tests/**,app/src/tests/**
            -Dsonar.rust.lcov.reportPaths=lcov-rust.info
            -Dsonar.javascript.lcov.reportPaths=app/coverage/lcov.info
            -Dsonar.rust.clippy.enabled=false
            -Dsonar.coverage.exclusions=app/src/main.tsx,app/src-tauri/src/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
