name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/sidecar
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - run: cargo clippy --workspace --all-targets
      - name: Each crate builds on its own, without the features its neighbours bring along
        shell: bash
        run: |
          for one in linkunbound-core linkunbound-win linkunbound-mac linkunbound-shell linkunbound-settings; do
            cargo check -p "$one" --all-targets
          done
      - run: cargo nextest run --workspace --no-tests=pass
      # Compiling the doc tests is most of what they cost, and macOS is the job with time to spare.
      - if: runner.os == 'macOS'
        run: cargo test --doc --workspace

  lint:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: cargo fmt --all --check

  picker:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  prose:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:md

  audit:
    name: advisories + licences
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - name: npm advisories in the picker
        working-directory: app
        run: npm audit --package-lock-only --audit-level=moderate
      - name: npm advisories in the repository tooling
        env:
          # braces has no patched release; it reaches markdownlint-cli2 through globby, dev tooling only.
          KNOWN: GHSA-vfj7-8cjw-p6xm
        run: |
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit.json" || true
          jq -e '.vulnerabilities' "$RUNNER_TEMP/audit.json" > /dev/null
          found=$(jq -r '[.vulnerabilities[].via[] | objects
            | select(.severity != "low" and .severity != "info") | .url] | unique[]' "$RUNNER_TEMP/audit.json")
          left=$(grep -v "/$KNOWN\$" <<< "$found" || true)
          if [ -n "$left" ]; then
            echo "::error::npm advisories at moderate or above:"
            echo "$left"
            exit 1
          fi
          if ! grep -q "/$KNOWN\$" <<< "$found"; then
            echo "::warning::$KNOWN no longer shows up; drop it from this step"
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov,nextest

      - name: What a desktop is not needed to build
        run: |
          # The picker pulls in a tray and a window: tray-icon wants GTK and winit wants the
          # display libraries. All of it has to link; none of it has to run, because the tests
          # that need a window ask Slint's testing backend for one instead of the screen.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libxcb1-dev
          cargo llvm-cov nextest -p linkunbound-core -p linkunbound-shell --lcov --output-path lcov-rust.info

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: The picker
        working-directory: app
        run: |
          npm ci
          npm run test:coverage

      - name: Every path is relative to the repository, which is what Sonar reads
        run: |
          sed -i "s|^SF:$PWD/|SF:|" lcov-rust.info
          sed -i -e "s|^SF:$PWD/app/|SF:app/|" -e "s|^SF:src/|SF:app/src/|" \
            app/coverage/lcov.info

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            lcov-rust.info
            app/coverage/lcov.info
          retention-days: 1

  coverage-mac:
    name: coverage / the Mac crate
    runs-on: macos-latest
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov,nextest
      - name: The Mac crate, and the Mac branches of the core and the picker
        run: cargo llvm-cov nextest -p linkunbound-mac -p linkunbound-core -p linkunbound-shell --lcov --output-path lcov-mac.info
      - name: Every path is relative to the repository, which is what Sonar reads
        run: sed -i '' "s|^SF:$PWD/|SF:|" lcov-mac.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-mac
          path: lcov-mac.info
          retention-days: 1

  sonar:
    name: sonarcloud
    needs: [coverage, coverage-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-mac
          path: .

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=crates,app/src,app/src-tauri/src
            -Dsonar.tests=crates,app/src
            -Dsonar.test.inclusions=crates/*/tests/**,app/src/**/*.test.ts,app/src/**/*.test.tsx
            -Dsonar.exclusions=crates/*/tests/**,app/src/tests/**
            -Dsonar.rust.lcov.reportPaths=lcov-rust.info,lcov-mac.info
            -Dsonar.javascript.lcov.reportPaths=app/coverage/lcov.info
            -Dsonar.cpd.exclusions=app/src/i18n.ts
            -Dsonar.rust.clippy.enabled=false
            -Dsonar.coverage.exclusions=app/src/main.tsx,app/src-tauri/src/**,crates/linkunbound-shell/src/main.rs,crates/linkunbound-shell/src/hotkey.rs
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
