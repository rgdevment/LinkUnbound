name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build. Publishes nothing."
        required: false
        default: "0.0.0-dispatch"

permissions:
  contents: write
  attestations: write
  id-token: write

# Two releases at once interleave their writes to the feed, and the one that finishes last wins
# rather than the newest.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BUILD_MACOS: "true"

jobs:
  gate:
    name: Style and prose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:md
      - name: Frontend style
        working-directory: app
        run: |
          npm ci
          npm run lint

  rust:
    name: fmt + clippy
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: The resident rides along
        shell: bash
        run: bash scripts/sidecar.sh
      - run: cargo clippy --workspace --all-targets

  version:
    name: Resolve the version
    needs: [gate, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      macos: ${{ steps.resolve.outputs.macos }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - name: Signing secrets come in pairs
        run: |
          fail() { echo "::error::$1"; exit 1; }

          if [ -n "$PFX_BASE64" ] && [ -z "$PFX_PASSWORD" ]; then
            fail "PFX_BASE64 is set but PFX_PASSWORD is empty"
          fi
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            fail "MACOS_CERTIFICATE_P12 is set but MACOS_CERTIFICATE_PASSWORD is empty"
          fi
          if [ -n "$APPLE_ID" ] && { [ -z "$APPLE_APP_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            fail "APPLE_ID is set but APPLE_APP_PASSWORD or APPLE_TEAM_ID is empty"
          fi
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            fail "MACOS_CERTIFICATE_P12 is set but APPLE_SIGNING_IDENTITY is empty: the app would be bundled unsigned"
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$BUILD_MACOS" = "true" ]; then
            if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$APPLE_ID" ]; then
              fail "no Apple signing or notarization secrets. A disk image that is not notarized \
          is one Gatekeeper refuses, and the README promises otherwise."
            fi
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ -z "$PFX_BASE64" ]; then
            fail "no Windows signing certificate. Set PFX_BASE64 and PFX_PASSWORD, or the \
          installer goes out unsigned."
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::notice::the updater key carries no password; that is fine if it was made without one"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              fail "no updater key. Every copy already out there would be told about this release \
          and none could take it, and a release is not something an installed copy learns was \
          taken back. Set TAURI_SIGNING_PRIVATE_KEY."
            fi
            echo "::warning::no updater key; this build cannot be installed by an existing copy"
          fi
          echo "signing secrets are coherent"

      - id: resolve
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="${{ inputs.version }}"
          fi

          # Strict semver: a leading zero is not a number semver will read, and a copy that
          # cannot parse the version it is running stops hearing about every release after it.
          num='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$version" =~ ^$num\.$num\.$num(-$pre(\.$pre)*)?$ ]]; then
            echo "::error::«$version» is not a version semver reads (1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi

          # rc10 is compared letter by letter against rc9, so it sorts *below* it: a copy on rc9
          # would never be told about rc10. Dotted, the number is compared as a number.
          if [[ "$version" =~ -rc[0-9]{2,} ]]; then
            echo "::error::«$version» has to be written rc.${BASH_REMATCH[0]#-rc}: past rc9, \
          semver reads rc10 as older than rc2"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "macos=${BUILD_MACOS}" >> "$GITHUB_OUTPUT"
          echo "version $version (pre-release: $prerelease)"

  bundle-windows:
    name: linkunbound-windows-installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      # The resident is a binary of its own and the bundler only carries what `externalBin` names.
      # Without this the installer ships the settings window alone, and every link runs nothing.
      - name: The resident rides along
        shell: bash
        run: |
          cargo build --release --bin linkunbound-shell --target "$TARGET"
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/linkunbound-shell.exe" \
             "app/src-tauri/binaries/linkunbound-shell-$TARGET.exe"

      # A public key in the config makes the private one a build requirement, so a run without the
      # secret has to say so rather than fail on a line about an environment variable.
      - name: Bundle
        working-directory: app
        shell: bash
        run: |
          sign=""
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then sign="--no-sign"; fi
          npm run tauri build -- --bundles nsis $sign

      - name: The installer carries both binaries
        shell: bash
        run: |
          setup=$(ls target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1) || true
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi
          # Read from the generated script, not the installer: the payload is LZMA-compressed, so
          # searching the exe for a filename finds nothing whether it is in there or not.
          # A sidecar that silently failed to be picked up looks exactly like a working release
          # until someone installs it and no link opens.
          script=$(ls target/release/nsis/*/installer.nsi | head -1)
          if [ -z "$script" ] || ! grep -q 'oname=linkunbound-shell.exe' "$script"; then
            echo "::error::the generated installer script does not lay down the resident; the           sidecar was not bundled"
            exit 1
          fi
          echo "the installer lays down the resident"

      - name: Sign the installer
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          Set-Content -Path signingCert.pfx -Value $bytes -AsByteStream

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool not found"; exit 1 }

          $setup = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) { Write-Error "no installer to sign"; exit 1 }

          & $signtool.FullName sign /f signingCert.pfx /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }
          Remove-Item signingCert.pfx

          $sig = Get-AuthenticodeSignature $setup.FullName
          if (-not $sig.TimeStamperCertificate) {
            Write-Error "no timestamp: the signature would die with the certificate"; exit 1
          }
          Write-Host "status: $($sig.Status)"

      - name: Name it after the release
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          setup=$(ls target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1) || true
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi
          cp "$setup" "dist/linkunbound-installer-$v-windows-x86_64.exe"
          ls -l dist

      # The bundler signed the installer it built, and signtool then rewrote those bytes. The
      # signature the updater checks has to be made against what actually ships, so it is made
      # last: a signature over bytes that no longer exist reads exactly like a working release.
      - name: Sign it for the updater
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        working-directory: app
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          exe="../dist/linkunbound-installer-$v-windows-x86_64.exe"
          rm -f "$exe.sig"
          npm run tauri -- signer sign "$exe"
          test -s "$exe.sig" || { echo "::error::no updater signature was written"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: dist/*
          if-no-files-found: error

  bundle-macos:
    name: linkunbound-macos-installer
    needs: version
    if: needs.version.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TARGET: universal-apple-darwin
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      - name: The resident rides along, for both chips
        run: bash scripts/sidecar.sh release "$TARGET"

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build
        working-directory: app
        run: npm run tauri build -- --target "$TARGET" --no-bundle

      - name: Sign the settings binary
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          bin="target/$TARGET/release/linkunbound-settings"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          codesign --verify --strict --verbose "$bin"

      - name: Bundle
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          sign=""
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then sign="--no-sign"; fi
          npm run tauri bundle -- --target "$TARGET" --bundles app,dmg $sign

      - name: It launches the resident, for a link, from the menu bar
        run: |
          app="target/$TARGET/release/bundle/macos/LinkUnbound.app"
          plist="$app/Contents/Info.plist"
          test -d "$app" || { echo "::error::the bundler produced no app"; exit 1; }
          status=0
          want() {
            if [ "$(plutil -extract "$1" raw -o - "$plist" 2>/dev/null)" != "$2" ]; then
              echo "::error::$1 is «$(plutil -extract "$1" raw -o - "$plist" 2>/dev/null)», not «$2»"
              status=1
            fi
          }
          want CFBundleExecutable linkunbound-shell
          want LSUIElement true
          want CFBundleIdentifier dev.rgdevment.linkunbound
          want CFBundleShortVersionString "${{ needs.version.outputs.version }}"
          for one in linkunbound-shell linkunbound-settings; do
            bin="$app/Contents/MacOS/$one"
            test -x "$bin" || { echo "::error::$one is not in the bundle"; status=1; continue; }
            archs=$(lipo -archs "$bin")
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) echo "$one: $archs" ;;
              *) echo "::error::$one is not universal: $archs"; status=1 ;;
            esac
          done
          exit $status

      - name: The app is really signed
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          app="target/$TARGET/release/bundle/macos/LinkUnbound.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::$app came out ad-hoc signed; notarisation would refuse it"
            exit 1
          fi

      - name: Notarize
        if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          dmg=$(ls target/$TARGET/release/bundle/dmg/*.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 900
          xcrun stapler staple "$dmg"

      # The updater replaces the .app, not the disk image, and the bundler tars it long before any
      # of the above. Left alone that tarball carries an app with no ticket stapled to it, and every
      # launch after an update would wait on Gatekeeper asking Apple over the network.
      - name: Staple the app itself, and tar it again
        if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          out="target/$TARGET/release/bundle/macos"
          app="$out/LinkUnbound.app"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 900
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

          rm -f "$out"/*.app.tar.gz "$out"/*.app.tar.gz.sig
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$out/LinkUnbound.app.tar.gz" -C "$out" LinkUnbound.app

          # The tarball is what a copy out there will unpack over itself. If the ticket did not
          # survive the round trip, better it fails here than on someone's machine.
          rm -rf "$RUNNER_TEMP/rt" && mkdir -p "$RUNNER_TEMP/rt"
          tar -xzf "$out/LinkUnbound.app.tar.gz" -C "$RUNNER_TEMP/rt"
          codesign --verify --deep --strict "$RUNNER_TEMP/rt/LinkUnbound.app"
          xcrun stapler validate "$RUNNER_TEMP/rt/LinkUnbound.app"

      - name: Sign it for the updater
        if: env.TAURI_SIGNING_PRIVATE_KEY != '' && env.APPLE_ID != ''
        working-directory: app
        run: |
          out="../target/$TARGET/release/bundle/macos"
          npm run tauri -- signer sign "$out/LinkUnbound.app.tar.gz"
          test -s "$out/LinkUnbound.app.tar.gz.sig"

      - name: Name it after the release
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          out="target/$TARGET/release/bundle/macos"
          # The bundler leaves a tarball of its own during the build, before any of the stapling.
          # Publishing that one would replace a notarised app with an unnotarised one, so it only
          # travels when the ticket is on it.
          app="$out/LinkUnbound.app"
          if xcrun stapler validate "$app" >/dev/null 2>&1 \
            && [ -s "$out/LinkUnbound.app.tar.gz.sig" ]; then
            cp "$out/LinkUnbound.app.tar.gz" "dist/linkunbound-$v-macos-universal.app.tar.gz"
            cp "$out/LinkUnbound.app.tar.gz.sig" "dist/linkunbound-$v-macos-universal.app.tar.gz.sig"
          else
            echo "::warning::no stapled, signed tarball; macOS gets no self-update this release"
            rm -f "$out/LinkUnbound.app.tar.gz" "$out/LinkUnbound.app.tar.gz.sig"
          fi
          dmg=$(ls target/$TARGET/release/bundle/dmg/*.dmg 2>/dev/null | head -1) || true
          if [ -z "$dmg" ]; then
            echo "::error::the bundler produced no disk image"
            exit 1
          fi
          cp "$dmg" "dist/linkunbound-installer-$v-macos-universal.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          path: dist/*
          if-no-files-found: error

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  bundle-msix:
    name: linkunbound-windows-msix
    needs: version
    if: needs.version.outputs.prerelease == 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      made: ${{ steps.gate.outputs.go }}
    env:
      TARGET: x86_64-pc-windows-msvc
      MSIX_IDENTITY: ${{ vars.MSIX_IDENTITY }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
    steps:
      # The identity is issued by Partner Center and cannot be guessed. Building a package with
      # the wrong one produces something the Store refuses on upload, after the whole build.
      - name: Nothing to build without a reserved identity
        id: gate
        shell: bash
        run: |
          if [ -z "$MSIX_IDENTITY" ] || [ -z "$MSIX_PUBLISHER" ]; then
            echo "::notice::MSIX_IDENTITY or MSIX_PUBLISHER not set; no MSIX this run"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.go == 'yes'

      - uses: ./.github/actions/prepare
        if: steps.gate.outputs.go == 'yes'
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        if: steps.gate.outputs.go == 'yes'
        working-directory: app
        run: npm ci

      - name: The resident rides along
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: bash scripts/sidecar.sh release

      - name: Build
        if: steps.gate.outputs.go == 'yes'
        working-directory: app
        run: npm run tauri build -- --no-bundle

      - name: Lay the package out
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          # Four numbers, the last always zero: MSIX has no room for a prerelease suffix, and
          # the Store reserves the fourth for itself. `numbered()` in shop.rs reads the first
          # three back, so anything else makes the Store offer a version nobody published.
          export QUAD="${v%%-*}.0"

          mkdir -p msix/Assets
          cp target/release/linkunbound-settings.exe msix/
          cp target/release/linkunbound-shell.exe msix/
          for logo in StoreLogo Square44x44Logo Square71x71Logo Square150x150Logo; do
            cp "app/src-tauri/icons/$logo.png" "msix/Assets/$logo.png"
          done

          python3 scripts/fill_manifest.py app/src-tauri/msix/AppxManifest.xml.in msix/AppxManifest.xml

          if grep -q "@[A-Z_]*@" msix/AppxManifest.xml; then
            echo "::error::a placeholder survived the manifest"
            exit 1
          fi

      - name: Pack
        if: steps.gate.outputs.go == 'yes'
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { Write-Host "::error::no Windows SDK with makeappx"; exit 1 }

          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          & "$($sdk.FullName)\x64\makeappx.exe" pack /d msix /p "dist/linkunbound-$v-windows-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::makeappx refused the package"; exit 1 }
          Get-ChildItem dist

      # The identity is what decides whether somebody running 1.x is ever offered this. Read back
      # from the package rather than from the file we wrote, so a pack that dropped it says so.
      - name: It went in under the identity 1.x shipped with
        if: steps.gate.outputs.go == 'yes'
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } |
            Sort-Object Name -Descending | Select-Object -First 1
          $v = "${{ needs.version.outputs.version }}"
          $out = "$env:RUNNER_TEMP\unpacked"
          & "$($sdk.FullName)\x64\makeappx.exe" unpack /p "dist/linkunbound-$v-windows-x64.msix" /d $out /o | Out-Null

          [xml]$m = Get-Content "$out\AppxManifest.xml"
          $said = $m.Package.Identity.Name
          $quad = ($v -split '-')[0] + '.0'
          Write-Host "identity: $said   version: $($m.Package.Identity.Version)"

          # What 1.x published, written down here rather than read from the variable that filled
          # the manifest: comparing the package against its own input would pass a typo through,
          # and under any other name the Store sees a different application — so nobody running
          # LinkUnbound today would ever be offered this one.
          $was = "rgdevment.LinkUnbound-BrowserPicker"
          if ($said -ne $was) {
            Write-Host "::error::the package went in as $said. 1.x shipped as $was, and under any other name nobody who has it installed is offered this."; exit 1
          }
          if ($m.Package.Identity.Version -ne $quad) {
            Write-Host "::error::the package says $($m.Package.Identity.Version) and the tag says $quad"; exit 1
          }
          $exe = $m.Package.Applications.Application.Executable
          if ($exe -ne "linkunbound-shell.exe") {
            Write-Host "::error::the package launches $exe, which is not what the shell runs for a link"; exit 1
          }

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          name: bundle-msix
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [version, bundle-windows, bundle-macos, bundle-msix]
    if: >-
      !cancelled() && needs.bundle-windows.result == 'success'
      && (needs.bundle-macos.result == 'success' || needs.bundle-macos.result == 'skipped')
      && (needs.bundle-msix.result == 'success' || needs.bundle-msix.result == 'skipped')
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the feed push retries with a rebase, which a shallow clone cannot do.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Gather
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          # The package goes to the Store and nowhere else. Unsigned it cannot be installed by
          # anybody who downloads it, and the Store signs it on publication — so putting it on the
          # releases page offers a file that looks installable and is not.
          rm -f dist/*.msix
          ls -l dist

      # Everything here happens before the release is created. A release published without a
      # usable signature is one every copy is told about and none can take, and taking it back is
      # not something an installed copy ever learns about.
      - name: Everything that should be here, is
        run: |
          v="${{ needs.version.outputs.version }}"
          status=0
          want="dist/linkunbound-installer-$v-windows-x86_64.exe"
          if [ "${BUILD_MACOS}" = "true" ]; then
            want="$want dist/linkunbound-$v-macos-universal.app.tar.gz"
            if [ ! -s "dist/linkunbound-installer-$v-macos-universal.dmg" ]; then
              echo "::error::the macOS disk image is missing"
              status=1
            fi
          fi
          for one in $want; do
            if [ ! -s "$one" ]; then
              echo "::error::$one is missing or empty"
              status=1
            fi
            if [ ! -s "$one.sig" ]; then
              echo "::error::$one.sig is missing; the release would offer an update nobody can take"
              status=1
            fi
          done
          exit $status

      # The key that signed it has to be the key every copy carries. They are two secrets in two
      # places, and the only thing that says they are halves of the same pair is this. Checked
      # here, a mismatch costs a failed run; checked after publishing, it costs a release that
      # verifies nowhere and a feed that already announced it.
      - name: The signature answers to the key this build ships
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          v="${{ needs.version.outputs.version }}"
          exe="dist/linkunbound-installer-$v-windows-x86_64.exe"

          jq -r '.plugins.updater.pubkey' app/src-tauri/tauri.conf.json | base64 -d > feed.pub
          for one in "$exe" "dist/linkunbound-$v-macos-universal.app.tar.gz"; do
            [ -s "$one" ] || continue
            base64 -d < "$one.sig" > one.minisig
            if ! minisign -Vm "$one" -p feed.pub -x one.minisig; then
              echo "::error::$one was signed with a key that is not the one in \
          tauri.conf.json. Every copy built from this tree carries that public key, so nothing \
          could ever verify this update. Nothing was published."
              exit 1
            fi
          done
          echo "the signatures and the shipped key are halves of the same pair"

      - name: Checksums
        run: |
          cd dist
          shopt -s nullglob
          for one in linkunbound-*; do
            case "$one" in *.sha256) continue ;; esac
            sha256sum "$one" > "$one.sha256"
          done
          ls -l

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/linkunbound-*

      - name: Notes from the tag
        id: notes
        run: |
          body=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" \
            | sed '/-----BEGIN SSH SIGNATURE-----/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba}')
          {
            echo "body<<LU_EOF"
            echo "$body"
            echo "LU_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Where every installed copy looks: an orphan branch holding the three feeds and nothing
      # else. Serving them from the release of each version is what cannot work —
      # releases/latest/download/ follows the date a release was published rather than the version
      # in it, and never points at a prerelease, so the candidate channel would be dead and a
      # maintenance release for an older series would walk the feed backwards.
      - name: The feed
        run: |
          v="${{ needs.version.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          win="linkunbound-installer-$v-windows-x86_64.exe"
          mac="linkunbound-$v-macos-universal.app.tar.gz"

          # Composed before the checkout below swaps the working tree out from under us. The
          # updater asks for its own chip by name, so the one universal archive is listed twice.
          if [ -s "dist/$win.sig" ]; then
            ws=$(cat "dist/$win.sig")
            ms=$(cat "dist/$mac.sig" 2>/dev/null || true)
            jq -n --arg v "$v" \
                  --arg n "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
                  --arg wu "$base/$win" --arg ws "$ws" \
                  --arg mu "$base/$mac" --arg ms "$ms" \
              '{version: $v, notes: $n, platforms:
                 ({"windows-x86_64": {url: $wu, signature: $ws}}
                  + (if $ms == "" then {}
                     else {"darwin-aarch64": {url: $mu, signature: $ms},
                           "darwin-x86_64":  {url: $mu, signature: $ms}} end))}' \
              > "$RUNNER_TEMP/channel.json"
            cat "$RUNNER_TEMP/channel.json"
          else
            # The notice feed and the update feed have to move together. Advertising a version the
            # updater cannot then find leaves every copy pressing a button that answers "gone".
            echo "::error::no updater signature for $v; the release would offer an update nobody can take"
            exit 1
          fi

          if git fetch origin manifest --depth 1 2>/dev/null; then
            git checkout -B manifest FETCH_HEAD
          else
            # Without a parent, or the branch carries a copy of the whole source beside the feed
            # and that copy is never updated again.
            git checkout --orphan manifest
            git rm -rq --cached . 2>/dev/null || true
            # The index is cleared but the files are not: the branch we came from carries copies
            # of these, and they would be read as the feed and committed as it.
            rm -f release-manifest.json latest.json candidate.json
          fi

          # Re-running the workflow of a release that has since been passed would otherwise walk
          # the feed backwards and offer everybody a version they already left behind. Each track
          # is held against its own: a candidate run never touches the stable one.
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            was=$(jq -r '.latestPrerelease // ""' release-manifest.json 2>/dev/null || echo "")
            track="candidates"
          else
            was=$(jq -r '.latest // ""' release-manifest.json 2>/dev/null || echo "")
            track="stable"
          fi
          if [ -n "$was" ] && [ "$was" != "$v" ] \
             && [ "$(printf '%s\n%s\n' "$was" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::the $track feed already says $was, and this run would set it back to \
                  $v. Nothing was written."
            exit 1
          fi

          latest=$(jq -r '.latest // ""' release-manifest.json 2>/dev/null || echo "")
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            jq -n --arg l "${latest:-0.0.0}" --arg c "$v" \
              '{schema: 1, latest: $l, latestPrerelease: $c}' > release-manifest.json
            cp "$RUNNER_TEMP/channel.json" candidate.json
          else
            ahead=$(jq -r '.latestPrerelease // ""' release-manifest.json 2>/dev/null || echo "")
            if [ -n "$ahead" ] \
               && [ "$(printf '%s\n%s\n' "$ahead" "$v" | sort -V | tail -1)" = "$ahead" ]; then
              jq -n --arg l "$v" --arg c "$ahead" \
                '{schema: 1, latest: $l, latestPrerelease: $c}' > release-manifest.json
            else
              jq -n --arg l "$v" '{schema: 1, latest: $l}' > release-manifest.json
              rm -f candidate.json
            fi
            cp "$RUNNER_TEMP/channel.json" latest.json
          fi
          cat release-manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged one at a time and compared after: naming a file that is not there is a pathspec
          # error, and a stable release has just taken candidate.json away. Comparing after the
          # staging keeps a channel file from being skipped on a run where the version manifest
          # happened not to change.
          for one in release-manifest.json latest.json candidate.json; do
            git add -A -- "$one" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "already says $v"
            exit 0
          fi
          git commit -m "chore: release manifest for $v"
          for attempt in 1 2 3 4 5; do
            if git push origin manifest; then
              exit 0
            fi
            echo "the feed would not push (${attempt}/5)"
            git fetch origin manifest && git rebase origin/manifest || true
            sleep $((attempt * 5))
          done
          echo "::error::the feed could not be pushed; the release is out and nothing announces it"
          exit 1

  msstore:
    name: Microsoft Store
    needs: [version, publish, bundle-msix]
    if: >-
      !cancelled() && needs.publish.result == 'success' && needs.bundle-msix.result == 'success'
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.version.outputs.prerelease == 'false'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      STORE_PUBLISH: ${{ vars.STORE_PUBLISH }}
      STORE_APP_ID: ${{ vars.STORE_APP_ID }}
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
    steps:
      # Off unless somebody says otherwise. A submission is reviewed by people and cannot be
      # taken back once it is in their queue, so it is not something a tag should start by
      # accident on the way to fixing something else.
      - name: Nothing to submit without being asked
        id: gate
        shell: bash
        run: |
          if [ "$STORE_PUBLISH" != "true" ]; then
            echo "::notice::STORE_PUBLISH is not true; the Store gets nothing until it is"
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.bundle-msix.outputs.made }}" != "yes" ]; then
            echo "::notice::no MSIX was built this run; nothing to submit"
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ -z "$STORE_APP_ID" ] || [ -z "$STORE_TENANT_ID" ] || [ -z "$STORE_SELLER_ID" ] || [ -z "$STORE_CLIENT_ID" ] || [ -z "$STORE_CLIENT_SECRET" ]; then
            echo "::notice::the Store credentials are not all here; nothing to submit"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          name: bundle-msix
          path: dist

      # v1.4 of the action installs a CLI that reads the Store's empty answer to a commit as broken
      # JSON and dies in a .NET stack trace after the submission was taken. Pinned to the CLI that
      # does not, the way Tisty publishes.
      - uses: microsoft/microsoft-store-apppublisher@v1.3
        if: steps.gate.outputs.go == 'yes'
        with:
          version: v0.4.2

      - name: Submit
        id: sent
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          msix=$(ls dist/*.msix 2>/dev/null | head -1) || true
          if [ -z "$msix" ]; then
            echo "::error::the artifact carried no package to submit"
            exit 1
          fi
          msstore reconfigure \
            --tenantId "$STORE_TENANT_ID" \
            --sellerId "$STORE_SELLER_ID" \
            --clientId "$STORE_CLIENT_ID" \
            --clientSecret "$STORE_CLIENT_SECRET"
          set +e
          msstore publish "$msix" --appId "$STORE_APP_ID" 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          set -e

          # The Store had the package and the commit was posted; what the client lost was the poll
          # it was holding. Sending again would file the same submission twice.
          if [ "$code" -ne 0 ] && grep -q "CommitStarted" publish.log; then
            echo "::warning::the Store took the submission and is processing it; the client lost \
            the poll it was holding. Nothing here has to be sent again."
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo "submitted $msix; the listing is reviewed by people and appears when they say so"
          fi
          exit "$code"

      - name: What the Store made of it
        if: always() && steps.gate.outputs.go == 'yes' && steps.sent.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::publishing failed before the Store took the submission; asking what state it is in"
          msstore submission status "$STORE_APP_ID" || true
          echo "::error::the package reached the Store but no commit was confirmed. Read the status \
          above before tagging again: a submission already committed must not be sent twice."

  verify:
    name: The update is installable
    needs: [version, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success'
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # What a copy out there will do in a day's time, done here first. A signature made against
      # the wrong bytes reads exactly like a working release until someone tries to install it.
      - name: Take the update the way an installed copy would
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          v="${{ needs.version.outputs.version }}"
          file=latest.json
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then file=candidate.json; fi
          feed="https://raw.githubusercontent.com/${{ github.repository }}/manifest/$file"

          # raw serves with max-age=300, so the wait has to outlast the cache or it fails on that
          # rather than on anything being wrong.
          said=""
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -H "Cache-Control: no-cache" -o channel.json "$feed"; then
              said=$(jq -r .version channel.json)
              [ "$said" = "$v" ] && break
            fi
            echo "the channel still says «${said:-nothing}» (${attempt}/6)"
            sleep $((attempt * 20))
          done
          if [ "$said" != "$v" ]; then
            echo "::error::$file says «${said:-nothing}», this release is $v"
            exit 1
          fi
          jq . channel.json

          jq -r '.plugins.updater.pubkey' app/src-tauri/tauri.conf.json | base64 -d > feed.pub

          for os in $(jq -r '.platforms | keys[]' channel.json); do
            url=$(jq -r --arg os "$os" '.platforms[$os].url' channel.json)
            jq -r --arg os "$os" '.platforms[$os].signature' channel.json | base64 -d > one.sig

            # The address has to be the tag of the version being offered, or a feed could announce
            # one version and hand over the signed installer of another — a rollback the signature
            # alone cannot catch, because those bytes really were ours.
            case "$url" in
              "https://github.com/${{ github.repository }}/releases/download/v$v/"*) ;;
              *) echo "::error::$os points at $url, which is not the v$v release"; exit 1 ;;
            esac

            curl -fsSL -o one.bin "$url"
            if minisign -Vm one.bin -p feed.pub -x one.sig; then
              echo "$os verifies"
            else
              echo "::error::$os does not verify against the key this build ships"
              exit 1
            fi
          done

  homebrew:
    name: Homebrew tap
    needs: [version, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success'
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.version.outputs.macos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      - name: Update the tap
        if: env.GIST_TOKEN != ''
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ needs.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          DMG="linkunbound-installer-${VERSION}-macos-universal.dmg"

          if [[ "$VERSION" == *-* ]]; then
            CASK="linkunbound-beta"; CASK_OTHER="linkunbound"; SUFFIX=" (beta)"
          else
            CASK="linkunbound"; CASK_OTHER="linkunbound-beta"; SUFFIX=""
          fi

          for attempt in 1 2 3 4 5; do
            if curl -fSL -o "/tmp/$DMG" "$BASE/$DMG" && [ -s "/tmp/$DMG" ]; then
              break
            fi
            echo "$DMG not downloadable yet (attempt ${attempt}/5)"
            sleep $((attempt * 10))
          done
          [ -s "/tmp/$DMG" ] || { echo "::error::could not download $DMG"; exit 1; }
          DMG_SHA=$(sha256sum "/tmp/$DMG" | awk '{print $1}')

          git clone "https://x-access-token:${GIST_TOKEN}@github.com/rgdevment/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Casks

          cat > "Casks/${CASK}.rb" <<-CASK
          	cask "${CASK}" do
          	  version "${VERSION}"
          	  sha256 "${DMG_SHA}"

          	  url "${BASE}/${DMG}"
          	  name "LinkUnbound"
          	  desc "Browser picker that asks which browser opens each link${SUFFIX}"
          	  homepage "https://github.com/${{ github.repository }}"

          	  auto_updates true

          	  conflicts_with cask: "${CASK_OTHER}"
          	  depends_on macos: :ventura

          	  app "LinkUnbound.app"

          	  uninstall script: {
          	              executable:   "#{appdir}/LinkUnbound.app/Contents/MacOS/linkunbound-settings",
          	              args:         ["--unregister"],
          	              must_succeed: false,
          	            },
          	            quit:   "dev.rgdevment.linkunbound"

          	  zap trash: [
          	    "~/Library/Application Support/LinkUnbound",
          	    "~/Library/Preferences/dev.rgdevment.linkunbound.plist",
          	    "~/Library/Preferences/com.rgdevment.linkunbound.plist",
          	    "~/Library/Saved Application State/dev.rgdevment.linkunbound.savedState",
          	    "~/Library/Saved Application State/com.rgdevment.linkunbound.savedState",
          	  ]
          	end
          CASK

          git add Casks
          if git diff --cached --quiet; then
            echo "tap already at ${VERSION}"
            exit 0
          fi
          git commit -m "linkunbound ${VERSION}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5); rebasing onto the concurrent release"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the tap after 5 attempts"
          exit 1
