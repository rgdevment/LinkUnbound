name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g. 1.0.0 or 1.0.0-beta.1)"
                required: false
                default: "1.0.0-dev"

permissions:
    contents: read

jobs:
    prepare:
        runs-on: ubuntu-latest
        name: Prepare release
        timeout-minutes: 5
        outputs:
            version: ${{ steps.version.outputs.version }}
            is-prerelease: ${{ steps.version.outputs.is-prerelease }}
            package-name: ${{ steps.naming.outputs.package-name }}
            package-desc: ${{ steps.naming.outputs.package-desc }}
            publish-store: ${{ steps.credentials.outputs.publish-store }}
            publish-taps: ${{ steps.credentials.outputs.publish-taps }}

        steps:
            - uses: actions/checkout@v7

            - name: Read version from event
              id: event
              env:
                  DISPATCH_VERSION: ${{ github.event.inputs.version }}
              run: |
                  set -euo pipefail

                  if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                    version="$DISPATCH_VERSION"
                  elif [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
                    version="${BASH_REMATCH[1]}"
                  else
                    version="1.0.0"
                  fi

                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Resolve version
              id: version
              uses: ./.github/actions/resolve-version
              with:
                  version: ${{ steps.event.outputs.version }}

            - name: Select package identity
              id: naming
              env:
                  IS_PRERELEASE: ${{ steps.version.outputs.is-prerelease }}
              run: |
                  set -euo pipefail

                  if [[ "$IS_PRERELEASE" == "true" ]]; then
                    name="linkunbound-beta"
                    desc="Smart browser router for HTTP(S) links (beta)"
                  else
                    name="linkunbound"
                    desc="Smart browser router for HTTP(S) links"
                  fi

                  {
                    echo "package-name=$name"
                    echo "package-desc=$desc"
                  } >> "$GITHUB_OUTPUT"

            - name: Check distribution credentials
              id: credentials
              env:
                  STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
                  STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
                  STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
                  STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
                  STORE_APP_ID: ${{ vars.STORE_APP_ID }}
                  GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
                  MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
                  PFX_BASE64: ${{ secrets.PFX_BASE64 }}
              run: |
                  set -euo pipefail

                  missing=""
                  for name in STORE_TENANT_ID STORE_SELLER_ID STORE_CLIENT_ID STORE_CLIENT_SECRET STORE_APP_ID; do
                    if [[ -z "${!name}" ]]; then
                      missing="$missing $name"
                    fi
                  done

                  if [[ -n "$missing" ]]; then
                    echo "::warning::Microsoft Store publishing will be skipped; missing:${missing}"
                    echo "publish-store=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "publish-store=true" >> "$GITHUB_OUTPUT"
                  fi

                  if [[ -z "$GIST_TOKEN" ]]; then
                    echo "::warning::Homebrew and Scoop updates will be skipped; missing GIST_TOKEN"
                    echo "publish-taps=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "publish-taps=true" >> "$GITHUB_OUTPUT"
                  fi

                  if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
                    echo "::warning::MACOS_CERTIFICATE_P12 is not set; the macOS build will be ad-hoc signed and not notarized"
                  fi

                  if [[ -z "$PFX_BASE64" ]]; then
                    echo "::warning::PFX_BASE64 is not set; the Windows installer will not be signed"
                  fi

    build-windows:
        needs: prepare
        uses: ./.github/workflows/release-win.yml
        with:
            version: ${{ needs.prepare.outputs.version }}
        secrets: inherit

    build-macos:
        needs: prepare
        uses: ./.github/workflows/release-mac.yml
        with:
            version: ${{ needs.prepare.outputs.version }}
        secrets: inherit

    github-release:
        runs-on: ubuntu-latest
        needs: [prepare, build-windows, build-macos]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 10
        name: Create GitHub Release

        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref_name }}
                  fetch-depth: 0

            - name: Extract tag message
              id: tag_message
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  MSG=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" | sed '/-----BEGIN SSH SIGNATURE-----/,$d' | sed -e :a -e '/^\n*$/{$d;N;ba}')

                  {
                    echo "TAG_BODY<<TAG_BODY_EOF"
                    echo "$MSG"
                    echo "TAG_BODY_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Download Windows artifacts
              uses: actions/download-artifact@v8
              with:
                  name: release-windows
                  path: artifacts/windows

            - name: Download macOS artifacts
              uses: actions/download-artifact@v8
              with:
                  name: release-macos
                  path: artifacts/macos

            - name: List artifacts
              run: find artifacts/ -type f

            - uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      artifacts/windows/**/*_Setup.exe
                      artifacts/windows/**/*_store.msix*
                      artifacts/macos/**/*.dmg

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  body: ${{ steps.tag_message.outputs.TAG_BODY }}
                  generate_release_notes: true
                  prerelease: ${{ needs.prepare.outputs.is-prerelease == 'true' }}
                  make_latest: true
                  files: |
                      artifacts/windows/**/*_Setup.exe
                      artifacts/windows/**/*_store.msix*
                      artifacts/macos/**/*.dmg
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    update-homebrew-cask:
        runs-on: ubuntu-latest
        needs: [prepare, github-release]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.publish-taps == 'true'
        timeout-minutes: 5
        name: Update Homebrew Tap

        steps:
            - uses: actions/checkout@v7

            - name: Fetch published DMG
              id: asset
              uses: ./.github/actions/fetch-release-asset
              with:
                  repository: ${{ github.repository }}
                  tag: ${{ github.ref_name }}
                  asset: LinkUnbound_${{ needs.prepare.outputs.version }}_universal.dmg

            - name: Publish cask
              uses: ./.github/actions/publish-manifest
              with:
                  repository: rgdevment/homebrew-tap
                  token: ${{ secrets.GIST_TOKEN }}
                  path: Casks/${{ needs.prepare.outputs.package-name }}.rb
                  message: Update ${{ needs.prepare.outputs.package-name }} to ${{ needs.prepare.outputs.version }}
                  content: |
                      cask "${{ needs.prepare.outputs.package-name }}" do
                        version "${{ needs.prepare.outputs.version }}"
                        sha256 "${{ steps.asset.outputs.sha256 }}"

                        url "${{ steps.asset.outputs.url }}"
                        name "LinkUnbound"
                        desc "${{ needs.prepare.outputs.package-desc }}"
                        homepage "https://github.com/${{ github.repository }}"

                        depends_on macos: :ventura

                        app "LinkUnbound.app"

                        zap trash: [
                          "~/Library/Application Support/com.rgdevment.linkunbound",
                          "~/Library/Preferences/com.rgdevment.linkunbound.plist",
                        ]
                      end

    update-scoop-bucket:
        runs-on: ubuntu-latest
        needs: [prepare, github-release]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.publish-taps == 'true'
        timeout-minutes: 5
        name: Update Scoop Bucket

        steps:
            - uses: actions/checkout@v7

            - name: Fetch published installer
              id: asset
              uses: ./.github/actions/fetch-release-asset
              with:
                  repository: ${{ github.repository }}
                  tag: ${{ github.ref_name }}
                  asset: LinkUnbound_${{ needs.prepare.outputs.version }}_x64_Setup.exe

            - name: Publish manifest
              uses: ./.github/actions/publish-manifest
              with:
                  repository: rgdevment/scoop-bucket
                  token: ${{ secrets.GIST_TOKEN }}
                  path: bucket/${{ needs.prepare.outputs.package-name }}.json
                  message: ${{ needs.prepare.outputs.package-name }} ${{ needs.prepare.outputs.version }}
                  validate-json: "true"
                  content: |
                      {
                        "version": "${{ needs.prepare.outputs.version }}",
                        "description": "${{ needs.prepare.outputs.package-desc }}",
                        "homepage": "https://github.com/${{ github.repository }}",
                        "license": "GPL-3.0-only",
                        "architecture": {
                          "64bit": {
                            "url": "${{ steps.asset.outputs.url }}",
                            "hash": "${{ steps.asset.outputs.sha256 }}"
                          }
                        },
                        "innosetup": true,
                        "extract_dir": "{app}",
                        "shortcuts": [
                          [
                            "linkunbound.exe",
                            "LinkUnbound"
                          ]
                        ],
                        "post_install": [
                          "Start-Process -FilePath \"$dir\\linkunbound.exe\" -ArgumentList \"--register\" -Wait"
                        ]
                      }

    publish-to-store:
        runs-on: windows-latest
        needs: [prepare, github-release]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.is-prerelease != 'true' && needs.prepare.outputs.publish-store == 'true'
        timeout-minutes: 15
        name: Publish to Microsoft Store

        steps:
            - name: Install Microsoft Store Developer CLI
              uses: microsoft/microsoft-store-apppublisher@v1.4

            - name: Download Windows artifacts
              uses: actions/download-artifact@v8
              with:
                  name: release-windows
                  path: artifacts/windows

            - name: Find MSIX package
              id: find_msix
              shell: bash
              run: |
                  set -eu

                  MSIX=""
                  for pattern in "*.msixupload" "*.msixbundle" "*.msix"; do
                    MSIX=$(find artifacts/windows -name "$pattern" | head -1)
                    if [ -n "$MSIX" ]; then
                      break
                    fi
                  done

                  if [ -z "$MSIX" ]; then
                    echo "::error::No MSIX package found in release-windows artifact"
                    find artifacts/windows -type f
                    exit 1
                  fi

                  echo "MSIX_PATH=$MSIX" >> "$GITHUB_OUTPUT"
                  echo "Found: $MSIX"

            - name: Configure Microsoft Store CLI
              shell: bash
              env:
                  STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
                  STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
                  STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
                  STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
              run: |
                  set -euo pipefail

                  msstore reconfigure \
                    --tenantId "$STORE_TENANT_ID" \
                    --sellerId "$STORE_SELLER_ID" \
                    --clientId "$STORE_CLIENT_ID" \
                    --clientSecret "$STORE_CLIENT_SECRET"

            - name: Publish to Microsoft Store
              shell: bash
              env:
                  MSIX_PATH: ${{ steps.find_msix.outputs.MSIX_PATH }}
                  STORE_APP_ID: ${{ vars.STORE_APP_ID }}
              run: |
                  set -euo pipefail

                  msstore publish "$MSIX_PATH" --appId "$STORE_APP_ID"
