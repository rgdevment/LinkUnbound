name: Bundle

on:
  push:
    branches: [main]
    paths:
      - "app/src-tauri/nsis/**"
      - "app/src-tauri/Info.plist"
      - "app/src-tauri/tauri.conf.json"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/build.rs"
      - "scripts/sidecar.sh"
      - "Cargo.toml"
      - ".github/workflows/bundle.yml"
      - ".github/workflows/release.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `paths` on the trigger leaves a required check unreported for good; a skipped job counts as met.
  changes:
    name: what the branch touched
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.look.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: look
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched='^(app/src-tauri/(nsis/|Info\.plist|tauri\.conf\.json|Cargo\.toml|build\.rs)|scripts/sidecar\.sh|Cargo\.toml$|\.github/workflows/(bundle|release)\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          if git diff --name-only --diff-filter=d "$from" HEAD | grep -qE "$watched"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  nsis:
    name: the installer builds
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      - name: The resident rides along
        shell: bash
        run: bash scripts/sidecar.sh release

      - name: Bundle
        working-directory: app
        shell: bash
        run: npm run tauri build -- --bundles nsis --no-sign

      - name: It carries both binaries, and the hooks it was given
        shell: bash
        run: |
          setup=$(ls target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1) || true
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi

          script=$(ls target/release/nsis/*/installer.nsi 2>/dev/null | head -1) || true
          if [ -z "$script" ]; then
            echo "::error::makensis ran but left no script behind to read"
            exit 1
          fi

          status=0
          want() {
            if ! grep -q "$1" "$script"; then
              echo "::error::the generated installer does not $2"
              status=1
            fi
          }
          want 'oname=linkunbound-shell.exe' "lay down the resident; the sidecar was not bundled"
          want '!include .*nsis.hooks\.nsh' "include our hooks; installerHooks did not resolve"
          exit $status

      - name: How big it came out
        shell: bash
        run: ls -lh target/release/bundle/nsis/*-setup.exe

  macos:
    name: the bundle builds
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      - name: One deployment target for the resident and the app
        run: |
          floor=$(jq -r '.bundle.macOS.minimumSystemVersion' app/src-tauri/tauri.conf.json)
          echo "MACOSX_DEPLOYMENT_TARGET=$floor" >> "$GITHUB_ENV"

      - name: The resident rides along
        run: bash scripts/sidecar.sh release "$TARGET"

      - name: Bundle
        working-directory: app
        run: npm run tauri build -- --target "$TARGET" --bundles app --no-sign

      - name: It launches the resident, for a link, from the menu bar
        run: |
          app="target/$TARGET/release/bundle/macos/LinkUnbound.app"
          plist="$app/Contents/Info.plist"
          test -d "$app" || { echo "::error::the bundler produced no app"; exit 1; }
          status=0
          want() {
            if [ "$(plutil -extract "$1" raw -o - "$plist" 2>/dev/null)" != "$2" ]; then
              echo "::error::$1 is «$(plutil -extract "$1" raw -o - "$plist" 2>/dev/null)», not «$2»"
              status=1
            fi
          }
          want CFBundleExecutable linkunbound-shell
          want LSUIElement true
          want CFBundleIdentifier dev.rgdevment.linkunbound
          want LSMinimumSystemVersion 13.0
          want CFBundleURLTypes.0.CFBundleURLSchemes.0 http
          want CFBundleURLTypes.0.CFBundleURLSchemes.1 https
          want CFBundleDocumentTypes.0.LSItemContentTypes.0 public.html
          for one in linkunbound-shell linkunbound-settings; do
            bin="$app/Contents/MacOS/$one"
            test -x "$bin" || { echo "::error::$one is not in the bundle"; status=1; continue; }
            archs=$(lipo -archs "$bin")
            if [ "$archs" != arm64 ]; then
              echo "::error::$one is «$archs», not arm64 alone"
              status=1
            fi
            echo "$one: $archs"
          done
          exit $status

      - name: How big it came out
        run: du -sh "target/$TARGET/release/bundle/macos/LinkUnbound.app"
