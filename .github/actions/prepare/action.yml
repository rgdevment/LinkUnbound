name: Prepare the build
description: Rust toolchain and the release version stamped into the manifest.

inputs:
  version:
    description: Version to stamp into Cargo.toml.
    required: true
  targets:
    description: Rust targets to install, comma separated.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/toolchain
      with:
        targets: ${{ inputs.targets }}

    - name: Stamp the version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        version="$VERSION"

        cargo fetch --locked --offline 2>/dev/null || cargo fetch --locked

        sed -i.bak -e "s/^version = .*/version = \"$version\"/" Cargo.toml
        rm -f Cargo.toml.bak

        if ! grep -q "^version = \"$version\"\$" Cargo.toml; then
          echo "::error::could not stamp $version into Cargo.toml"
          exit 1
        fi

        cargo update --workspace --offline
