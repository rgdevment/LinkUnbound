serde.workspace = true




[target."cfg(windows)".dependencies]

linkunbound-win.workspace = true
windows-future = "0.2"
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Services_Store",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
