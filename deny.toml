[licenses]
# Permissive licences only. GPL-3.0 can depend on these; the reverse is not
# true, so anything copyleft in the tree would be a problem worth knowing about.
allow = [
  "GPL-3.0-only", # ours
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Unmaintained rather than vulnerable, reached only through Tauri and not ours
# to replace. Listed one by one so a new advisory still fails the build. The GTK3
# entries Tisty carries are absent on purpose: this ships to Windows and macOS only.
ignore = [
  "RUSTSEC-2024-0370",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
